name: Build FOSS armeabi-v7a APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FOSS armeabi-v7a release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Same as build.yml: Gradle signs the APK using release.keystore.
      # If RELEASE_KEYSTORE_BASE64 secret exists it is used, otherwise a
      # temporary keystore is generated so the APK is still signed/installable.
      - name: Prepare keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "Release keystore decoded from secret."
          else
            keytool -genkeypair -keystore release.keystore \
              -storepass android -keypass android \
              -alias key -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Flow Custom"
            echo "No secret found. Generated temporary keystore."
          fi

      - name: Build FOSS release APKs
        run: >
          ./gradlew :app:assembleFossRelease
          --max-workers=2 --build-cache --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'key' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}

      - name: Verify APK signature
        run: |
          ls -la app/build/outputs/apk/foss/release/
          apk=app/build/outputs/apk/foss/release/app-foss-armeabi-v7a-release.apk
          test -f "$apk"
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"

      - name: Upload FOSS ARMv7 APK
        uses: actions/upload-artifact@v7
        with:
          name: flow-foss-armeabi-v7a-release-apk
          path: app/build/outputs/apk/foss/release/app-foss-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
