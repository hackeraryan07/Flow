name: Build FOSS armeabi-v7a APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FOSS armeabi-v7a release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Optional: agar secret hai to signed APK banegi, warna unsigned.
      - name: Decode Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "Release keystore decoded."
          else
            echo "No keystore secret found. Building UNSIGNED APK."
          fi

      # Sirf armeabi-v7a ABI build hota hai (injected abi), universal/arm64/x86 skip.
      - name: Build FOSS armeabi-v7a release APK
        run: >
          ./gradlew :app:assembleFossRelease
          -Pandroid.injected.build.abi=armeabi-v7a
          --max-workers=2 --build-cache --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}

      - name: Locate APK
        run: |
          mkdir -p dist-foss
          find app/build -name "*.apk" -print
          apk=$(find app/build -name "*.apk" -path "*foss*" | head -1)
          test -n "$apk"
          cp "$apk" dist-foss/app-foss-armeabi-v7a-release.apk
          ls -la dist-foss

      - name: Upload FOSS ARMv7 APK
        uses: actions/upload-artifact@v7
        with:
          name: flow-foss-armeabi-v7a-release-apk
          path: dist-foss/app-foss-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
